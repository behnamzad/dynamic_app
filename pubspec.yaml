name: dynamic_app
description: "A Flutter app that dynamically predicts user behavior using deep learning to personalize the experience in real-time."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  fdottedline_nullsafety:
  carousel_slider:
  json_annotation:
  shimmer:
#  location: ^5.0.2+1
  syncfusion_flutter_charts: ^29.1.38
  bloc_test:
  overlay_support:
  flutter_svg: ^1.1.4
  share_plus: "7.2.2"
  db_viewer:
  freezed_annotation: ^2.4.4
  flutter_bloc:
  injectable:
  shamsi_date: ^1.1.1
  shared_preferences:
  encrypt:
  string_validator:
  flutter_secure_storage: "8.1.0"
  dio:
  pretty_dio_logger:
  logger:
  device_info_plus:
  equatable:
  package_info_plus:
  auto_route: 9.2.0
  loading_overlay: ^0.4.3
  sprintf: ^7.0.0
  flutter_toast:
    git:
      url: https://flutter:flutter78@gitlab.asredanesh.com/mobilebanking/flutter-toast.git
      ref: development-ff-mehr


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  auto_route_generator:
  get_it:
  loading_overlay: ^0.4.3

flutter:
  uses-material-design: true

  fonts:
    - family: Yekan
      fonts:
        - asset: assets/fonts/yekan_light.ttf
          weight: 300
        - asset: assets/fonts/yekan.ttf
          weight: 400
        - asset: assets/fonts/yekan_medium.ttf
          weight: 500
        - asset: assets/fonts/yekan_bold.ttf
          weight: 700
        - asset: assets/fonts/yekan_extra_bold.ttf
          weight: 800

