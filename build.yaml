targets:
  $default:
    builders:
      injectable_generator|injectable_config_builder:
        enabled: true
        generate_for:
          include:
            - lib/di/injection_container.dart
      injectable_generator:injectable_builder:
        enabled: true
        options:
          cache_build: true

            #          auto_register: true
            # auto registers any class with a name matches the given pattern
          #          class_name_pattern:
          #                         "Service$|Repository$|Bloc$"
          # auto registers any class inside a file with a
          # name matches the given pattern
      #          file_name_pattern: "_service$|_repository$|_bloc$"

      auto_route_generator:auto_route_generator: # this for @RoutePage
        options:
          enable_cached_builds: true
          generate_for:
            - lib/feature/**_page.dart
      auto_route_generator:auto_router_generator: # this for @AutoRouterConfig
        options:
          enable_cached_builds: true
          generate_for:
            - lib/core/presentation/route/app_router.dart

      freezed:
        enabled: true
        options:
          cache_build: true
